# 'postgres' 프로필 — Render 등 운영 배포용.
# 접속 정보는 대시보드에서 넣는 DB_URL / DB_USER / DB_PASSWORD 세 값으로 받는다.
# (기본 application.yml 은 로컬 H2 그대로 유지)
#
# 일부러 기본값을 두지 않는다. 값이 비면 기동이 실패해야 한다 —
# 기본값이 있으면 운영에서 조용히 인메모리 H2 로 떨어져, 저장되는 줄 알았던
# 데이터가 재시작마다 사라진다.
#
# DB_URL 예시: jdbc:postgresql://<host>:5432/<db>?sslmode=require
# 외부 호스팅 Postgres 는 대개 SSL 을 요구하므로 sslmode 를 URL 에 포함한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
