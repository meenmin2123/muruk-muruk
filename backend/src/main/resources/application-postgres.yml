# 'postgres' 프로필 — Render 등 운영 배포용.
# 접속 정보는 대시보드에서 넣는 DB_URL / DB_USER / DB_PASSWORD 세 값으로 받는다.
# (기본 application.yml 은 로컬 H2 그대로 유지)
#
# 일부러 기본값을 두지 않는다. 값이 비면 기동이 실패해야 한다 —
# 기본값이 있으면 운영에서 조용히 인메모리 H2 로 떨어져, 저장되는 줄 알았던
# 데이터가 재시작마다 사라진다.
#
# DB_URL 예시: jdbc:postgresql://<host>:5432/<db>?sslmode=require
# 외부 호스팅 Postgres 는 대개 SSL 을 요구하므로 sslmode 를 URL 에 포함한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    # 커넥션 풀 — 유휴 시 compute 를 정지시키는 서버리스 Postgres(Neon 등)에 맞춘 값.
    #
    # 핵심은 max-lifetime 이다. 그런 DB 는 유휴(기본 5분)가 되면 compute 를 내리면서
    # 열려 있던 커넥션을 끊는다. 그런데 Hikari 의 max-lifetime 기본값은 30분이라,
    # 서버가 이미 끊어버린 커넥션을 풀이 계속 쥐고 있게 된다. 유휴 후 첫 요청이
    # 죽은 커넥션을 집을 수 있으므로, 서버가 끊기 전에 풀이 먼저 정리하도록 4분으로 낮춘다.
    #
    # minimum-idle: 0 은 요청이 없을 때 풀을 완전히 비운다. 유휴 커넥션이 남아 있어도
    # 정지가 되는지는 자료마다 설명이 엇갈려서, 아예 남기지 않는 쪽으로 정리했다.
    hikari:
      maximum-pool-size: 5       # 무료 인스턴스(512MB)에 맞춘 상한
      minimum-idle: 0            # 요청이 끊기면 풀을 0으로 비운다
      idle-timeout: 60000        # 60초 유휴 → 커넥션 반납
      max-lifetime: 240000       # 4분 — 서버(5분)가 끊기 전에 먼저 폐기
      connection-timeout: 30000  # 정지 상태에서 깨어나는 시간 여유
