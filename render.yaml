# Render 블루프린트 — 무럽무럽 전체 스택(프론트 + 백엔드 + Postgres)을 한 번에 배포.
#
# 사용법:
#   1) 이 저장소를 Render에 연결 (Dashboard → New → Blueprint → 이 repo/branch 선택)
#   2) Render가 render.yaml 을 읽어 서비스 2개(백엔드·프론트)를 자동 생성
#   3) sync:false 로 표시된 값(DB 접속 정보, ANTHROPIC_API_KEY 등)을 대시보드에서 입력
#   4) Deploy
#
# 데이터베이스:
#   Render 무료 Postgres 는 기간이 지나면 만료·삭제되어 데이터가 사라진다(실제로 겪음).
#   그래서 DB 는 블루프린트가 만들지 않고, 외부 Postgres 를 쓴다.
#   대시보드에서 DB_URL / DB_USER / DB_PASSWORD 세 값을 넣어주면 된다.
#   DB_URL 예시: jdbc:postgresql://<host>:5432/<db>?sslmode=require
#   (외부 호스팅 Postgres 는 대개 SSL 을 요구하므로 sslmode=require 를 붙인다)
#
# 주의:
#   - Render가 서비스에 부여하는 실제 URL을 확인하고, 이름이 바뀌면 아래
#     NEXT_PUBLIC_API_BASE / CORS_ORIGINS 값을 그 URL로 맞춰주세요.
#   - 구글 로그인: 발급해둔 클라이언트 ID의 "승인된 자바스크립트 출처"에
#     프론트 URL(https://muruk-frontend.onrender.com)을 추가해야 동작합니다.

services:
  # --- 백엔드 (Kotlin / Spring Boot) ---
  - type: web
    name: muruk-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # 무료 등급(512MB)에 맞춰 JVM 힙 제한 — OOM 방지
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
      # 외부 Postgres 접속 정보 — 대시보드에서 입력한다(블루프린트에 값을 두지 않는다).
      # DB_URL 예시: jdbc:postgresql://<host>:5432/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # 구글 OAuth 웹 클라이언트 ID
      - key: GOOGLE_CLIENT_ID
        value: 799206979966-2lnqig1fc0unf4g7j2q44mll6kg4sn1f.apps.googleusercontent.com
      # 프론트 출처 허용(CORS) — 프론트 실제 URL로 맞추기
      - key: CORS_ORIGINS
        value: https://muruk-frontend.onrender.com
      # 관리자 이메일(쉼표 구분) — 전체 사용자 데이터 조회 가능
      - key: ADMIN_EMAILS
        value: min1016alsrud@gmail.com
      # Claude 코칭 키 — 대시보드에서 입력
      - key: ANTHROPIC_API_KEY
        sync: false
      # (선택) 노션 직접 백업 — 쓸 때만 대시보드에서 입력
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

  # --- 프론트 (Next.js 정적 export → Render 정적 사이트) ---
  # 정적 사이트는 CDN에서 서빙되어 콜드 스타트가 없고(항상 즉시 로딩), 무료다.
  # 앱은 순수 클라이언트 렌더라 서버가 필요 없다(로그인·데이터는 브라우저에서 백엔드 API 호출).
  - type: web
    name: muruk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:static
    staticPublishPath: out
    # 캐시된 옛 index.html로 옛 버전이 박히지 않게 HTML은 항상 재검증
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      # NEXT_PUBLIC_* 는 빌드 시점에 박힘 → 백엔드 실제 URL로 맞추기
      - key: NEXT_PUBLIC_API_BASE
        value: https://muruk-backend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 799206979966-2lnqig1fc0unf4g7j2q44mll6kg4sn1f.apps.googleusercontent.com
