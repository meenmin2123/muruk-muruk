name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 백엔드 (Kotlin/Spring)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: gradlew 실행 권한
        run: chmod +x ./gradlew
      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon

  frontend:
    name: 프론트 (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입체크
        run: npx tsc --noEmit
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080
